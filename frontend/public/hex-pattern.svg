<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="mol-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Hexágono molecular reutilizable (pointy-top, r=14) -->
    <g id="benzene" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="0,-14 12.12,-7 12.12,7 0,14 -12.12,7 -12.12,-7"/>
    </g>
  </defs>

  <g
    fill="none"
    stroke="#e67e22"
    stroke-width="1.1"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#mol-glow)"
  >
    <!-- Unidad 1 — rotada ~15° -->
    <g transform="translate(48,42) rotate(15)" stroke-opacity="0.5">
      <use href="#benzene"/>
      <!-- Doble enlace (lado derecho) -->
      <line x1="12.12" y1="-7" x2="12.12" y2="7" stroke-opacity="0.35" stroke-width="0.7" transform="translate(-1.2,0)"/>
      <!-- Sustituyentes -->
      <line x1="0" y1="-14" x2="0" y2="-22" stroke-opacity="0.4"/>
      <line x1="-12.12" y1="7" x2="-18" y2="11" stroke-opacity="0.35"/>
      <line x1="12.12" y1="7" x2="19" y2="12" stroke-opacity="0.35"/>
    </g>

    <!-- Unidad 2 — rotada ~-28° -->
    <g transform="translate(138,58) rotate(-28)" stroke-opacity="0.42">
      <use href="#benzene"/>
      <line x1="0" y1="-14" x2="5" y2="-24" stroke-opacity="0.38"/>
      <line x1="12.12" y1="-7" x2="20" y2="-12" stroke-opacity="0.32"/>
      <line x1="-12.12" y1="-7" x2="-20" y2="-14" stroke-opacity="0.32"/>
      <!-- Enlace a vecino -->
      <line x1="12.12" y1="7" x2="28" y2="18" stroke-opacity="0.3"/>
    </g>

    <!-- Unidad 3 — rotada ~42° -->
    <g transform="translate(92,148) rotate(42)" stroke-opacity="0.48">
      <use href="#benzene"/>
      <line x1="12.12" y1="-7" x2="12.12" y2="7" stroke-opacity="0.3" stroke-width="0.7" transform="translate(1.3,0)"/>
      <line x1="0" y1="14" x2="0" y2="24" stroke-opacity="0.4"/>
      <line x1="-12.12" y1="7" x2="-22" y2="14" stroke-opacity="0.35"/>
    </g>

    <!-- Unidad 4 — pequeña, rotada -->
    <g transform="translate(168,162) rotate(-12) scale(0.75)" stroke-opacity="0.38">
      <use href="#benzene"/>
      <line x1="0" y1="-14" x2="-6" y2="-22" stroke-opacity="0.35"/>
      <line x1="12.12" y1="7" x2="18" y2="14" stroke-opacity="0.3"/>
    </g>

    <!-- Unidad 5 — esquina superior derecha -->
    <g transform="translate(175,28) rotate(55)" stroke-opacity="0.36">
      <use href="#benzene"/>
      <line x1="-12.12" y1="-7" x2="-12.12" y2="7" stroke-opacity="0.28" stroke-width="0.7" transform="translate(1.2,0)"/>
      <line x1="12.12" y1="-7" x2="22" y2="-4" stroke-opacity="0.32"/>
    </g>

    <!-- Unidad 6 — inferior izquierda -->
    <g transform="translate(22,128) rotate(-38)" stroke-opacity="0.44">
      <use href="#benzene"/>
      <line x1="0" y1="-14" x2="0" y2="-21" stroke-opacity="0.38"/>
      <line x1="12.12" y1="7" x2="24" y2="10" stroke-opacity="0.3"/>
      <line x1="-12.12" y1="7" x2="-20" y2="16" stroke-opacity="0.32"/>
    </g>

    <!-- Enlaces entre unidades (líneas sueltas) -->
    <line x1="60" y1="52" x2="118" y2="68" stroke-opacity="0.22" stroke-width="0.9"/>
    <line x1="104" y1="134" x2="148" y2="88" stroke-opacity="0.18" stroke-width="0.8"/>
    <line x1="38" y1="118" x2="78" y2="142" stroke-opacity="0.2" stroke-width="0.8"/>
  </g>

  <!-- Partículas bokeh -->
  <g fill="#e67e22" opacity="0.55">
    <circle cx="28" cy="48" r="1.2" opacity="0.5"/>
    <circle cx="72" cy="88" r="0.9" opacity="0.4"/>
    <circle cx="155" cy="112" r="1.4" opacity="0.45"/>
    <circle cx="118" cy="28" r="0.8" opacity="0.35"/>
    <circle cx="42" cy="168" r="1.1" opacity="0.42"/>
    <circle cx="182" cy="138" r="0.7" opacity="0.38"/>
    <circle cx="88" cy="72" r="0.6" opacity="0.3"/>
    <circle cx="148" cy="178" r="1" opacity="0.4"/>
  </g>
</svg>
